# Reverse proxy + TLS termination for the Syncubator Flask backend, and
# static host for the Flutter *web* build used by the Pi's own kiosk screen
# (see docs/deployment.md). Mobile/native app clients only
# ever hit the API paths below, so this addition is backward compatible
# with them. Gunicorn is bound to 127.0.0.1:5000 only — Nginx is the sole
# entry point for everything.

server {
    listen 443 ssl;
    # LAN address plus the public hostnames that arrive via the Cloudflare
    # Tunnel (cloudflared -> https://127.0.0.1:443, TLS verify off because
    # this cert is self-signed; Cloudflare presents the real cert publicly).
    server_name 192.168.0.116 app.syncubator.in syncubator.in www.syncubator.in;

    ssl_certificate     /etc/nginx/ssl/syncubator.crt;
    ssl_certificate_key /etc/nginx/ssl/syncubator.key;

    # Flutter web build (kiosk), deployed to /var/www/html — see section 5
    # of docs/deployment.md. Flask defines no "/" route, so this must
    # be served by Nginx directly, not proxied.
    root /var/www/html;
    index index.html;

    # Camera stream: must NOT be buffered, or the MJPEG multipart stream
    # will stall/lag badly waiting for Nginx to fill its buffer.
    location /video_feed {
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: serve it as a static file from the web build if one
    # exists at that path; otherwise proxy to Flask. This used to be an
    # explicit whitelist of API paths (status|weight/tare|climate/settings|
    # bed/move|oxygen/level) which went stale every time a new endpoint was
    # added (weight/restart, bed/restart, oxygen/reading, system/exit_kiosk
    # all silently 405'd through nginx's own static handler until this was
    # noticed) — this app has no client-side URL routing, so there's no
    # need to fall back to index.html for unknown paths either; anything
    # that isn't a real static file is, by definition, meant for the API.
    # Kiosk-only endpoint: it kills Chromium on the incubator's screen. The
    # kiosk calls it with Host 127.0.0.1; anything arriving via the tunnel
    # carries Host app.syncubator.in (and via LAN, 192.168.0.116) and is refused
    # here regardless of what the client app does.
    location = /system/exit_kiosk {
        if ($host != "127.0.0.1") { return 403; }
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # Always revalidate the web build. Without this, Cloudflare caches
        # main.dart.js at its edge (default 2 h for .js) and browsers keep
        # serving a stale build long after a redeploy. nginx still answers
        # 304 via ETag, so repeat loads stay cheap.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ @backend;
    }

    location @backend {
        # Live sensor data: never cache (browser or Cloudflare).
        add_header Cache-Control "no-store";
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# Redirect plain HTTP to HTTPS instead of just failing.
server {
    listen 80;
    server_name 192.168.0.116 app.syncubator.in syncubator.in www.syncubator.in;
    return 301 https://$host$request_uri;
}
